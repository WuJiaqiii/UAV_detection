# Mainline A: original Maha++ rejection; 20 known classes.
experiment:
  protocol: all_known
  inputs:
  - /media/kaneki/05E4235537EC7AC2/dataset_wjq/train_dataset
  input_type: iq_dat
  recursive: true
  exclude_classes: []
  training_variant: primary_ce
  seed: 42
  val_ratio: 0.15
  calibration_ratio: 0.2
  test_ratio: 0.0
train:
  yolo_weights: /media/kaneki/5490675f-8f6a-4932-bae3-f457edde3ca0/wujiaqi/UAV_signal_detection/code/yolov5/runs/train/exp10/weights/best.pt
  iq_sample_rate: 100000000
  iq_byte_order: <
  backbone: resnet18
  mask_pretrained: true
  mask_img_size: 224
  epochs: 100
  batch_size: 32
  num_workers: 1
  lr: 0.0001
  grouping_mode: hopping
  hop_association: shape
  hop_shape_log_tol: 0.5
  train_group_policy: primary
  supcon_weight: 0.0
  bbox_cache_mode: 'off'
  event_mode: physical
  valid_band_policy: source
  singleton_min_confidence: 0.5
  singleton_min_contrast_z: 1.0
  event_context_gap_ms: 5.0
evaluation:
  signal_mode: multi
  unknown_input_mode: single
  novelty_policy: calibrated_track
  iq_stride_ms: 50.0
  max_slices: 0
  min_votes: 1
  track_feature_cosine_min: 0.8
  known_recheck: false
profile:
  profile_score_method: maha_pp_shrink
  profile_covariance_shrinkage: 0.1
  profile_calibration_unit: primary
  known_false_reject_rate: 0.01
  min_calibration_per_class: 5
  max_reference_per_class: 2000
  profile_recheck: false
discovery:
  unknown_cluster_backend: hdbscan
  unknown_cluster_policy: auto
  unknown_min_cluster_size: 5
  unknown_min_samples: 3
  unknown_min_recordings: 2
  unknown_allow_single_cluster: true
  save_visuals: false
  save_feature_plots: false
  feature_plot_method: pca
