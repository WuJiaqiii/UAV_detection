# Mainline A + public count bounds. Prefer infer.sh TRAINING_RUN DATA_ROOT.
evaluation:
  checkpoint_path: /path/to/new_training/training/models/best.pth
  yolo_weights: /media/kaneki/5490675f-8f6a-4932-bae3-f457edde3ca0/wujiaqi/UAV_signal_detection/code/yolov5/runs/train/exp10/weights/best.pt
  signal_mode: multi
  recursive: true
  iq_sample_rate: 100000000
  iq_stride_ms: 50.0
  max_slices: 0
  min_votes: 1
  track_feature_cosine_min: 0.8
  settings:
    event_mode: physical
    valid_band_policy: source
    singleton_min_confidence: 0.5
    singleton_min_contrast_z: 1.0
    event_context_gap_ms: 5.0
infer:
  inputs:
  - /path/to/1-1
  open_set_profile: /path/to/new_training/open_set/known_profile.npz
  fast: true
  save_discovery_cache: true
  unknown_input_mode: single
  competition_profile: task1_n1
  test_item: 1-1
  unknown_cluster_policy: auto
  unknown_min_cluster_size: 5
  unknown_min_recordings: 2
  unknown_min_silhouette: 0.15
  known_recheck: false
  unknown_bounded_strategy: density_merge
  unknown_cluster_backend: hdbscan
  unknown_min_samples: 3
