# Full labeled experiment. Replace paths and class names with real DAT folders.
experiment:
  inputs: [/media/kaneki/05E4235537EC7AC2/dataset_wjq/train_dataset]
  input_type: iq_dat
  recursive: true
  known_classes: [DAUTEL EVO NANO, DJFPV, DJI FPV COMBO, DJI MINI3 PRO, DJI_Inspire_2, DJI_MATRICE_200, DJI_MATRICE_600_Pro, DJMavicMini, DJMiniSE, EVOIIPRO, FIMIX8SE2020, FIMIx8Mini, FLYSKY FS I6X, FRSKY X20R, HubsanZino2, JUMPER T14]
  # DAUTEL EVO NANO, DEVENTION DEVO, DJFPV, DJI AVATA2, DJI FPV COMBO, DJI MAVIC3 PRO, DJI MINI3 PRO, DJI_Inspire_2, DJI_MATRICE_200, DJI_MATRICE_600_Pro, DJMavicMini, DJMiniSE, EVOIIPRO, FIMIX8SE2020, FIMIx8Mini, FLYSKY FS I6X, FRSKY X14, FRSKY X20R, HubsanZino2, JUMPER T14 
  # Omit unknown_classes to use every other discovered class as unknown.
  # exclude_classes: [Background]  # Only if this folder exists; omit it entirely.
  seed: 42
  val_ratio: 0.15
  calibration_ratio: 0.20
  test_ratio: 0.15
  # recording_ids_json: /data/uav/recording_ids.json
  # split_only: true
train:
  yolo_weights: /media/kaneki/5490675f-8f6a-4932-bae3-f457edde3ca0/wujiaqi/UAV_signal_detection/code/yolov5/runs/train/exp10/weights/best.pt
  iq_sample_rate: 100000000
  iq_byte_order: "<"
  epochs: 100
  batch_size: 32
  num_workers: 1
  lr: 0.0001
  grouping_mode: hopping
  hop_association: shape
  # Allow modest height/aspect jitter for thin 4-6 pixel pulses.
  hop_shape_log_tol: 0.50
  supcon_weight: 0.1
  bbox_cache_mode: "off"
evaluation:
  signal_mode: multi
  novelty_policy: calibrated_track
  iq_stride_ms: 50.0
  max_slices: 0
  min_votes: 1
  # Shared frontend/group settings otherwise come from the trained checkpoint.
profile:
  # Single-device known recordings may contain several control/video components.
  profile_score_method: record_class_knn
  profile_scale_prior_records: 5.0
  knn_k: 5
  known_false_reject_rate: 0.01
  min_calibration_per_class: 5
  max_reference_per_class: 2000
discovery:
  save_feature_plots: true
  feature_plot_method: pca  # pca, tsne, both
  feature_plot_max_points: 3000
  feature_plot_seed: 42
  unknown_cluster_backend: hdbscan
  unknown_min_cluster_size: 5
  unknown_min_recordings: 2
  save_visuals: true
