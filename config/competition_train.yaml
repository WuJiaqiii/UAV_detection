# v3 mainline: fresh 20-class training, independent calibration, complete-duration inference.
# YOLO weights stay fixed. Train, profile, and all six tests use the same 0.02 gate.
experiment:
  protocol: all_known
  inputs: [/path/to/train_dataset]
  input_type: iq_dat
  recursive: true
  exclude_classes: []
  training_variant: primary_ce
  seed: 42
  val_ratio: 0.15
  calibration_ratio: 0.2
  test_ratio: 0.0
train:
  yolo_weights: /path/to/detector.pt
  yolo_conf_thres: 0.02
  iq_sample_rate: 100000000
  iq_byte_order: '<'
  backbone: resnet18
  mask_pretrained: true
  mask_img_size: 224
  epochs: 100
  save_val_detect_vis: false
  val_detect_vis_ratio: 0.0
  checkpoint_keep_last: 2
  checkpoint_keep_epochs: []
  batch_size: 32
  num_workers: 1
  lr: 0.0001
  grouping_mode: hopping
  hop_association: shape
  hop_shape_log_tol: 0.5
  train_group_policy: primary
  supcon_weight: 0.0
  bbox_cache_mode: 'off'
  event_mode: physical
  valid_band_policy: source
  singleton_min_confidence: 0.5
  singleton_min_contrast_z: 1.0
  event_context_gap_ms: 5.0
evaluation:
  signal_mode: multi
  unknown_input_mode: single
  iq_sample_rate: 100000000
  iq_byte_order: '<'
  yolo_conf_thres: 0.02
  novelty_policy: calibrated_track
  iq_stride_ms: 50.0
  tail_policy: cover
  max_slices: 0
  min_votes: 1
  track_feature_cosine_min: 0.8
  known_recheck: false
profile:
  profile_score_method: maha_pp_shrink
  profile_covariance_shrinkage: 0.1
  profile_calibration_unit: primary
  known_false_reject_rate: 0.01
  min_calibration_per_class: 5
  max_reference_per_class: 2000
  profile_recheck: false
discovery:
  unknown_cluster_backend: spectral
  unknown_bounded_strategy: spectral
  unknown_cluster_policy: auto
  spectral_neighbors: 10
  spectral_seed: 42
  spectral_n_init: 10
  unknown_min_cluster_size: 5
  unknown_min_samples: 3
  unknown_min_recordings: 2
  unknown_min_silhouette: 0.15
  unknown_allow_single_cluster: true
  save_visuals: false
  save_feature_plots: false
