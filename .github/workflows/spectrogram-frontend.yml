name: Spectrogram frontend checks
on:
  push:
    branches: ["main", "temp", "codex/**"]
  pull_request:
    paths:
      - "util/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "model/**"
      - "config/**"
      - "requirements.txt"
      - "prepare_submission.py"
      - "export_submission.py"
      - "main.py"
      - ".github/workflows/spectrogram-frontend.yml"
      - ".gitmodules"
      - "yolov5"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile project Python
        run: python -m compileall -q main.py prepare_submission.py export_submission.py util data model scripts tests
      - name: Frontend and dataset integration tests
        run: |
          mkdir -p work
          python -m unittest discover -s tests -v 2>&1 | tee work/test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: work/test-results.log
  actual-yolo-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify recorded YOLO submodule checkout
        run: |
          git submodule update --init --recursive
          expected_yolo_sha=$(git rev-parse HEAD:yolov5)
          actual_yolo_sha=$(git -C yolov5 rev-parse HEAD)
          test "$expected_yolo_sha" = "$actual_yolo_sha"
          git submodule status --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU YOLO dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compare real YOLO training and inference tensors
        env:
          UAV_TEST_REAL_YOLO: "1"
        run: python -m unittest discover -s tests -p test_yolo_native_contract.py -v
