name: Core checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.py"
      - "config/**"
      - "requirements.txt"
      - "run.sh"
      - ".github/workflows/**"
      - ".gitmodules"
      - "yolov5"
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Compile and check launcher
        run: |
          python -m compileall -q main.py model util data scripts tests
          bash -n run.sh
      - name: Core regression tests
        run: python -m unittest discover -s tests -v
  yolo-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual backend dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          test "$(git rev-parse HEAD:yolov5)" = "$(git -C yolov5 rev-parse HEAD)"
      - name: Actual inference input contract
        env:
          UAV_TEST_REAL_YOLO: "1"
        run: python -m unittest tests.test_yolo_native_contract -v
